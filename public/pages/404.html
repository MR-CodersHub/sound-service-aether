<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 &mdash; Page Not Found | AETHER CINEMATICS</title>
  <meta name="description" content="The page you were looking for could not be found. Explore Aether Cinematics services, blog and installations instead.">
  <link rel="icon" type="image/png" href="../../assets/images/logo.png">
  <link rel="stylesheet" href="../../src/css/style.css">
  <link rel="stylesheet" href="../../src/css/theme.css">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('aether-theme'); } catch (e) {}
      var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersLight ? 'light' : 'dark'));
      try {
        if (localStorage.getItem('aether-rtl') === '1') document.documentElement.setAttribute('dir', 'rtl');
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <main>
    <section class="page-hero" style="min-height:100vh; padding: 115px 0px;">
      <div class="container" style="text-align:center;position:relative;z-index:2;">
        <div class="error-code">404</div>
        <div class="eyebrow" style="justify-content:center;margin-top:1rem;">SIGNAL LOST</div>
        <h1 style="max-width:720px;margin:0 auto 1rem;">This Channel Is Off Air.</h1>
        <p style="max-width:560px;margin:0 auto 2.5rem;">
          The page you requested has been moved, renamed, or never existed. Let us guide you back to something worth watching.
        </p>
        <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
          <a href="../../index.html" class="btn btn-primary">
            <span>Back to Home</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </a>
          <a href="contact.html" class="btn btn-secondary">Contact Support</a>
        </div>
      </div>  
    </section>

  </main>
  <script src="../../src/js/ui.js"></script>
</body>
</html>
