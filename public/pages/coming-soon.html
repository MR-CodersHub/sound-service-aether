<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon &mdash; The AETHER Immersive Showroom | AETHER CINEMATICS</title>
  <meta name="description" content="Our flagship immersive showroom is under construction. Get notified when the doors open.">
  <link rel="icon" type="image/png" href="../../assets/images/logo.png">
  <link rel="stylesheet" href="../../src/css/style.css">
  <link rel="stylesheet" href="../../src/css/theme.css">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('aether-theme'); } catch (e) {}
      var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersLight ? 'light' : 'dark'));
      try {
        if (localStorage.getItem('aether-rtl') === '1') document.documentElement.setAttribute('dir', 'rtl');
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <main>
    <section class="page-hero" style="min-height:100vh;display:flex;align-items:center;text-align:center;">
      <div class="container" style="position:relative;z-index:2;max-width:820px;">
        <div class="eyebrow" style="justify-content:center;">UNDER CONSTRUCTION</div>
        <h1 style="margin-bottom:1.1rem;">The Immersive Showroom Is <span class="text-gradient">Coming Soon.</span></h1>
        <p style="margin:0 auto 1rem;">
          We are building a fully immersive demonstration suite where you can experience our private cinemas,
          reference audio systems and whole-home automation before a single cable is run in your own home.
        </p>

        <div class="countdown-grid" id="countdown" data-target="2026-12-01T10:00:00">
          <div class="countdown-cell"><div class="num" id="cd-days">00</div><div class="unit">Days</div></div>
          <div class="countdown-cell"><div class="num" id="cd-hours">00</div><div class="unit">Hours</div></div>
          <div class="countdown-cell"><div class="num" id="cd-mins">00</div><div class="unit">Minutes</div></div>
          <div class="countdown-cell"><div class="num" id="cd-secs">00</div><div class="unit">Seconds</div></div>
        </div>
      </div>
    </section>
  </main>

  <script src="../../src/js/ui.js"></script>
</body>
</html>
